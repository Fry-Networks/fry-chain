[workspace]
resolver = "2"
members = [
    "crates/frychain-core",
    "crates/frychain-crypto",
    "crates/frychain-consensus",
    "crates/frychain-vm",
    "crates/frychain-depin",
    "crates/frychain-network",
    "crates/frychain-storage",
    "crates/frychain-rpc",
    "crates/frychain-node",
    "crates/frychain-miner",
    "crates/frychain-cli",
]

[workspace.package]
version = "0.1.0"
edition = "2021"
authors = ["FryChain Foundation"]
license = "MIT OR Apache-2.0"
repository = "https://github.com/fry-foundation/fry-chain"
description = "FryChain - Post-Quantum PoW Blockchain with DePIN and Multi-VM Smart Contracts"

[workspace.dependencies]
# Serialization
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
bincode = "1.3"
hex = "0.4"
bs58 = "0.5"

# Cryptography - Post-Quantum
pqcrypto-dilithium = "0.5"
pqcrypto-sphincsplus = "0.7"
pqcrypto-traits = "0.3"

# Classical Cryptography (for compatibility)
sha3 = "0.10"
sha2 = "0.10"
blake3 = "1.5"
aes = "0.8"
rand = "0.8"
rand_chacha = "0.3"
ed25519-dalek = "2.1"
x25519-dalek = "2.0"
curve25519-dalek = "4.1"

# Networking
tokio = { version = "1.35", features = ["full"] }
libp2p = { version = "0.53", features = ["tokio", "tcp", "noise", "yamux", "gossipsub", "kad", "identify", "ping", "mdns"] }
tower = "0.4"

# Storage
rocksdb = "0.22"
lmdb-rkv = "0.14"

# RPC
jsonrpsee = { version = "0.21", features = ["server", "client", "macros"] }
axum = "0.7"
tower-http = { version = "0.5", features = ["cors", "trace"] }

# Async
futures = "0.3"
async-trait = "0.1"

# Logging
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }

# Error handling
thiserror = "1.0"
anyhow = "1.0"

# Utilities
parking_lot = "0.12"
dashmap = "5.5"
once_cell = "1.19"
bytes = "1.5"
uuid = { version = "1.6", features = ["v4"] }
chrono = { version = "0.4", features = ["serde"] }
num-bigint = "0.4"
num-traits = "0.2"
rayon = "1.8"
crossbeam = "0.8"

# CLI
clap = { version = "4.4", features = ["derive"] }
dialoguer = "0.11"
indicatif = "0.17"
console = "0.15"

# Testing
tempfile = "3.9"
criterion = "0.5"
proptest = "1.4"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"

[profile.dev]
opt-level = 0
debug = true
